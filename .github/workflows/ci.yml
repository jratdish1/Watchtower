name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      # Pinned by commit SHA. v5 runs on node24 (v4 used deprecated node20).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm ci --ignore-scripts --prefix backend
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --prefix frontend
      - name: No dependency install scripts (A14)
        run: node backend/test/no-install-scripts.test.js
      - name: Allowlist adapter
        run: node backend/test/allowlist.test.js
      - name: SSH scraper host-key policy (static)
        run: node backend/test/ssh-host-key-policy.test.js
      - name: Operator API auth and purge cap
        run: node backend/test/auth.test.js
      - name: Operator key trim at load
        run: node backend/test/operator-key-trim.test.js
      - name: Socket c2 guard
        run: node backend/test/c2-socket.test.js
      - name: FE XSS static guard
        run: node frontend/test/xss-static.test.js
      - name: PowerShell sensor key trim (static)
        run: node backend/test/ps-sensor-key-trim.test.js
      - name: Quarantine isolate_network hub IP (A13)
        run: node backend/test/quarantine-hub-ip.test.js
      - name: Deploy defaults fail closed (A15-A18)
        run: node backend/test/deploy-defaults.test.js
      - name: Service owner and edge install path (A19-A20)
        run: node backend/test/service-owner.test.js
      - name: Hub API URL reachable by sensors (A22)
        run: node backend/test/api-url.test.js
      - name: A23-A25 AI bridge verdict, service hardening, supervised child watch
        run: node backend/test/bridge-hardening.test.js
      - name: Glass Pane security headers
        run: node frontend/test/csp-headers.test.js
      - name: Glass Pane operator session
        run: node frontend/test/ui-auth.test.js
      - name: Step 5 isolated harness
        run: node frontend/test/step5-harness.test.js
      - name: IR P3 hardening (percent-encoding, action case, cookie opt-out)
        run: node frontend/test/ir-p3-hardening.test.js
      - name: Install hash-locked Python deps (A26)
        run: |
          python3 -m venv /tmp/wt-venv
          /tmp/wt-venv/bin/pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: A26 Python deps hash-lock, vuln floors, paramiko 5 live SSH
        env:
          WT_PY: /tmp/wt-venv/bin/python
        run: node backend/test/python-deps.test.js
